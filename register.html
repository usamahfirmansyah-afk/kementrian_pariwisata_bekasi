<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Daftar Akun - Sobat Wisata</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .register-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #6a5acd;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #6a5acd;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #5848c2;
    }
    .back {
      text-align: center;
      margin-top: 15px;
    }
    .back a {
      text-decoration: none;
      color: #6a5acd;
    }
  </style>
</head>
<body>

<div class="register-box">
  <h2>Daftar Akun</h2>
  <input type="text" placeholder="Nama Lengkap">
  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password">
  <button>Daftar</button>

  <div class="back">
    <a href="loginpage.html">← Kembali ke Login</a>
  </div>
</div>

</body>
</html>
